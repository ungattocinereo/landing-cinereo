version: '3.8'

services:
  cinereo-landing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinereo-landing
    image: cinereo-landing:latest
    ports:
      - "3003:80"
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - cinereo-network
    labels:
      - "com.cinereo.description=Cinereo Landing Page"
      - "com.cinereo.version=1.0"
      - "com.cinereo.port=3003"

networks:
  cinereo-network:
    driver: bridge
